name: Video Processor
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install Pillow
      - name: Render 100% Safe Reels
        run: |
          python -c "
          from PIL import Image, ImageDraw
          import subprocess

          width, height = 1080, 1920
          img = Image.new('RGB', (width, height), color='#111113')
          draw = ImageDraw.Draw(img)

          # 기본 폰트로 안전하게 텍스트 박스 및 레이아웃 생성
          draw.rectangle([100, 850, 980, 1050], fill='#000000', outline='#FFFFFF', width=2)
          draw.text((150, 910), 'THE LAST S-CLASS (W222 S500)', fill='#FFFFFF')
          draw.text((150, 970), 'El ultimo Clase S autentico', fill='#E1E1E1')

          img.save('safe_frame.png')

          cmd = [
              'ffmpeg', '-y', '-loop', '1', '-i', 'safe_frame.png',
              '-c:v', 'libx264', '-t', '5', '-pix_fmt', 'yuv420p',
              'Safe_Reels.mp4'
          ]
          subprocess.run(cmd, check=True)
          print('100% Success guaranteed!')
          "
      - name: Upload Safe Reels
        uses: actions/upload-artifact@v4
        with:
          name: Safe_Reels_Video
          path: Safe_Reels.mp4
