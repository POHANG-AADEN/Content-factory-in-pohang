name: Video Processor
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install Pillow
      - name: Render Full Magma Video
        run: |
          python -c "
          from PIL import Image, ImageDraw
          import subprocess
          img = Image.new('RGB', (1080, 1920), color='#1A1A1B')
          draw = ImageDraw.Draw(img)
          draw.rectangle([0, 840, 1080, 1080], fill='#FF4E00')
          draw.text((150, 900), 'THE LAST S-CLASS', fill='#FFFFFF')
          draw.text((150, 980), 'El ultimo Clase S autentico', fill='#E1E1E1')
          img.save('frame.png')
          subprocess.run(['ffmpeg', '-y', '-loop', '1', '-i', 'frame.png', '-c:v', 'libx264', '-t', '5', '-pix_fmt', 'yuv420p', 'W222_S500_Magma.mp4'], check=True)
          "
      - name: Upload Video
        uses: actions/upload-artifact@v4
        with:
          name: S500_Magma_Reels
          path: W222_S500_Magma.mp4
